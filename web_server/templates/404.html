{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 5rem 1rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">⚡</div>
    <h1 style="font-family: var(--font-heading); font-size: 2.5rem; font-weight: 800; margin-bottom: 0.8rem;">404 - Page Not Found</h1>
    <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 2rem;">{{ message or "The tournament, bracket, or page you are looking for does not exist or has been removed." }}</p>
    <a href="/" class="btn btn-primary">&larr; Return to Tournament Hub</a>
</div>
{% endblock %}
